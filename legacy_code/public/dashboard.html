<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your CampusFind Dashboard - Manage your lost and found items">
    <title>Dashboard - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="main-navbar"></div>

    <!-- Dashboard Header -->
    <div class="dashboard-header" style="padding-top: 6rem;">
        <div class="container">
            <h2 id="welcome-text">Welcome back!</h2>
            <p>Manage your lost and found items from your dashboard</p>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="container" style="margin-top: -2rem; position: relative; z-index: 10;">
        <div class="row g-4 mb-4">
            <div class="col-md-3 col-6">
                <div class="stat-card" style="margin-top:0;">
                    <div class="stat-icon" style="background: var(--gradient-1);"><i class="bi bi-box-seam"></i></div>
                    <div class="stat-number" id="my-total">0</div>
                    <div class="stat-label">My Reports</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card" style="margin-top:0;">
                    <div class="stat-icon" style="background: var(--gradient-2);"><i class="bi bi-exclamation-triangle"></i></div>
                    <div class="stat-number" id="my-lost">0</div>
                    <div class="stat-label">Lost Items</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card" style="margin-top:0;">
                    <div class="stat-icon" style="background: var(--gradient-3);"><i class="bi bi-check-circle"></i></div>
                    <div class="stat-number" id="my-found">0</div>
                    <div class="stat-label">Found Items</div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="stat-card" style="margin-top:0;">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #a55eea, #8854d0);"><i class="bi bi-hand-thumbs-up"></i></div>
                    <div class="stat-number" id="my-claimed">0</div>
                    <div class="stat-label">Claimed</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="container mb-4">
        <div class="d-flex gap-3 flex-wrap">
            <a href="/report-lost.html" class="btn btn-primary-custom">
                <i class="bi bi-exclamation-triangle me-2"></i>Report Lost Item
            </a>
            <a href="/report-found.html" class="btn btn-success-custom">
                <i class="bi bi-hand-thumbs-up me-2"></i>Report Found Item
            </a>
        </div>
    </div>

    <!-- My Items -->
    <div class="container pb-5">
        <h4 class="mb-3" style="font-weight: 700;">My Reported Items</h4>
        <div class="row" id="my-items">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await requireAuth('dashboard');
            if (!ok) return;

            document.getElementById('welcome-text').textContent = `Welcome back, ${currentUser.name}!`;
            loadMyItems();
        });

        async function loadMyItems() {
            try {
                const items = await apiRequest(`/items?user_id=${currentUser.id}`);
                const container = document.getElementById('my-items');

                document.getElementById('my-total').textContent = items.length;
                document.getElementById('my-lost').textContent = items.filter(i => i.status === 'Lost').length;
                document.getElementById('my-found').textContent = items.filter(i => i.status === 'Found').length;
                document.getElementById('my-claimed').textContent = items.filter(i => i.status === 'Claimed').length;

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="col-12">
                            <div class="empty-state">
                                <i class="bi bi-inbox"></i>
                                <h5>No items reported yet</h5>
                                <p>Start by reporting a lost or found item</p>
                                <a href="/report-lost.html" class="btn btn-primary-custom mt-2">Report an Item</a>
                            </div>
                        </div>`;
                    return;
                }

                container.innerHTML = items.map(item => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="item-card">
                        ${item.image
                            ? `<img src="${item.image}" class="item-card-img" alt="${item.item_name}">`
                            : `<div class="item-card-img-placeholder"><i class="bi bi-image"></i></div>`
                        }
                        <div class="item-card-body">
                            <div class="d-flex justify-content-between align-items-start mb-1">
                                <span class="item-card-category">${item.category_name || 'Uncategorized'}</span>
                                ${getStatusBadge(item.status)}
                            </div>
                            <h5 class="item-card-title">${item.item_name}</h5>
                            <p class="item-card-desc">${item.description || ''}</p>
                            <div class="item-card-footer">
                                <span class="item-card-location"><i class="bi bi-geo-alt"></i> ${item.location}</span>
                                <div>
                                    <a href="/item-details.html?id=${item.item_id}" class="btn btn-sm btn-outline-primary-custom">View</a>
                                    ${item.status !== 'Claimed' ? `
                                        <button class="btn btn-sm btn-success-custom ms-1" onclick="markClaimed(${item.item_id})">
                                            <i class="bi bi-check"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `).join('');
            } catch (err) {
                showToast('Failed to load items', 'error');
            }
        }

        async function markClaimed(itemId) {
            if (!confirm('Mark this item as claimed?')) return;
            try {
                await apiRequest(`/items/${itemId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status: 'Claimed' })
                });
                showToast('Item marked as claimed!', 'success');
                loadMyItems();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
