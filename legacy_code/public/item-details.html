<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View item details">
    <title>Item Details - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="main-navbar"></div>

    <div class="page-header" style="padding-top: 6rem;">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0" style="background:none;">
                    <li class="breadcrumb-item"><a href="/index.html" style="color:rgba(255,255,255,0.7);">Home</a></li>
                    <li class="breadcrumb-item active" style="color:#fff;">Item Details</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container py-4">
        <div id="item-detail" class="animate-fade-in">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>

    <!-- Claim Modal -->
    <div class="modal fade" id="claimModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="border-radius: var(--radius-lg); border: none;">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Claim This Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">Provide details to prove this item belongs to you or that you found the owner.</p>
                    <textarea class="form-control" id="claim-message" rows="4" placeholder="Describe why you believe this item is yours or how you can verify ownership..." required></textarea>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-primary-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-custom" id="submit-claim-btn" onclick="submitClaim()">
                        <i class="bi bi-send me-1"></i>Submit Claim
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        let currentItem = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await initPage('');
            loadItemDetails();
        });

        async function loadItemDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) {
                document.getElementById('item-detail').innerHTML = '<div class="text-center py-5"><h4>Item not found</h4><a href="/index.html" class="btn btn-primary-custom mt-2">Go Home</a></div>';
                return;
            }

            try {
                const item = await apiRequest(`/items/${id}`);
                currentItem = item;
                document.title = `${item.item_name} - CampusFind`;

                const claims = currentUser ? await apiRequest(`/claims/${id}`) : [];
                const isOwner = currentUser && currentUser.id === item.user_id;
                const hasClaimed = claims.some(c => c.user_id === currentUser?.id);

                document.getElementById('item-detail').innerHTML = `
                <div class="row g-4">
                    <div class="col-lg-6">
                        ${item.image
                            ? `<img src="${item.image}" class="item-detail-img" alt="${item.item_name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                               <div class="item-detail-placeholder" style="display:none;"><i class="bi bi-image"></i></div>`
                            : `<div class="item-detail-placeholder"><i class="bi bi-image"></i></div>`
                        }
                    </div>
                    <div class="col-lg-6">
                        <div class="glass-card p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="item-card-category">${item.category_name || 'Uncategorized'}</span>
                                ${getStatusBadge(item.status)}
                            </div>
                            <h2 class="fw-bold mb-3">${item.item_name}</h2>
                            <p class="text-muted mb-4">${item.description || 'No description provided'}</p>

                            <div class="mb-4">
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-geo-alt text-primary me-2" style="font-size:1.1rem;"></i>
                                    <span><strong>Location:</strong> ${item.location || 'N/A'}</span>
                                </div>
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-calendar text-primary me-2" style="font-size:1.1rem;"></i>
                                    <span><strong>Date:</strong> ${formatDate(item.date)}</span>
                                </div>
                                <div class="d-flex align-items-center mb-2">
                                    <i class="bi bi-person text-primary me-2" style="font-size:1.1rem;"></i>
                                    <span><strong>Reported by:</strong> ${item.user_name || 'Anonymous'}</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-envelope text-primary me-2" style="font-size:1.1rem;"></i>
                                    <span><strong>Contact:</strong> ${item.contact_info || item.user_email || 'N/A'}</span>
                                </div>
                            </div>

                            ${currentUser && !isOwner && item.status !== 'Claimed' && !hasClaimed ? `
                                <button class="btn btn-primary-custom w-100" data-bs-toggle="modal" data-bs-target="#claimModal">
                                    <i class="bi bi-hand-index me-2"></i>Claim This Item
                                </button>
                            ` : ''}
                            ${hasClaimed ? '<div class="alert alert-info mt-2 mb-0"><i class="bi bi-info-circle me-1"></i>You have already submitted a claim for this item.</div>' : ''}
                            ${!currentUser ? '<a href="/login.html" class="btn btn-primary-custom w-100">Login to Claim</a>' : ''}
                        </div>
                    </div>
                </div>

                <!-- Claims section for item owner -->
                ${isOwner && claims.length > 0 ? `
                <div class="mt-4">
                    <h4 class="fw-bold mb-3"><i class="bi bi-people me-2"></i>Claims (${claims.length})</h4>
                    <div class="glass-card p-3">
                        ${claims.map(c => `
                        <div class="d-flex align-items-start p-3 border-bottom">
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <strong>${c.user_name}</strong>
                                    <small class="text-muted">${formatDate(c.claim_date)}</small>
                                </div>
                                <p class="mb-1 text-muted">${c.message}</p>
                                <small>Email: ${c.user_email}</small>
                                <div class="mt-2">
                                    <span class="status-badge ${c.status === 'Approved' ? 'status-found' : c.status === 'Rejected' ? 'status-lost' : 'status-claimed'}">${c.status}</span>
                                    ${c.status === 'Pending' ? `
                                        <button class="btn btn-sm btn-success-custom ms-2" onclick="updateClaim(${c.claim_id}, 'Approved')">
                                            <i class="bi bi-check me-1"></i>Approve
                                        </button>
                                        <button class="btn btn-sm btn-danger-custom ms-1" onclick="updateClaim(${c.claim_id}, 'Rejected')">
                                            <i class="bi bi-x me-1"></i>Reject
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
                `;
            } catch (err) {
                document.getElementById('item-detail').innerHTML = '<div class="text-center py-5"><h4>Failed to load item details</h4><a href="/index.html" class="btn btn-primary-custom mt-2">Go Home</a></div>';
            }
        }

        async function submitClaim() {
            const message = document.getElementById('claim-message').value.trim();
            if (!message) {
                showToast('Please provide a message', 'warning');
                return;
            }

            const btn = document.getElementById('submit-claim-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

            try {
                await apiRequest('/claims', {
                    method: 'POST',
                    body: JSON.stringify({ item_id: currentItem.item_id, message })
                });
                showToast('Claim submitted successfully!', 'success');
                bootstrap.Modal.getInstance(document.getElementById('claimModal')).hide();
                loadItemDetails();
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-1"></i>Submit Claim';
            }
        }

        async function updateClaim(claimId, status) {
            try {
                await apiRequest(`/claims/${claimId}`, {
                    method: 'PUT',
                    body: JSON.stringify({ status })
                });
                showToast(`Claim ${status.toLowerCase()}!`, 'success');
                loadItemDetails();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
