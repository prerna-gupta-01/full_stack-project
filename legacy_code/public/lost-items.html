<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse lost items reported on campus">
    <title>Lost Items - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="main-navbar"></div>

    <div class="page-header" style="padding-top: 6rem;">
        <div class="container">
            <h2><i class="bi bi-exclamation-circle me-2"></i>Lost Items</h2>
            <p>Browse items reported as lost on campus</p>
        </div>
    </div>

    <div class="container py-4">
        <!-- Search & Filter -->
        <div class="search-container mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label fw-semibold">Search</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="search-input" placeholder="Search by name, description, or location...">
                    </div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Category</label>
                    <select class="form-select" id="category-filter">
                        <option value="">All Categories</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary-custom w-100" onclick="loadItems()">
                        <i class="bi bi-search me-1"></i>Search
                    </button>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-outline-primary-custom w-100" onclick="clearFilters()">
                        <i class="bi bi-x-circle me-1"></i>Clear
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <p class="text-muted mb-0" id="result-count">Loading...</p>
            <a href="/report-lost.html" class="btn btn-primary-custom btn-sm">
                <i class="bi bi-plus-circle me-1"></i>Report Lost Item
            </a>
        </div>

        <div class="row" id="items-container">
            <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initPage('lost');
            loadCategoryOptions('category-filter');
            loadItems();
        });

        // Search on Enter
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadItems();
        });

        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('category-filter').value = '';
            loadItems();
        }

        async function loadItems() {
            const search = document.getElementById('search-input').value;
            const category = document.getElementById('category-filter').value;

            let url = '/items?status=Lost';
            if (search) url += `&search=${encodeURIComponent(search)}`;
            if (category) url += `&category=${category}`;

            try {
                const items = await apiRequest(url);
                const container = document.getElementById('items-container');
                document.getElementById('result-count').textContent = `${items.length} item(s) found`;

                if (items.length === 0) {
                    showEmpty('items-container', 'No lost items found');
                    return;
                }

                container.innerHTML = items.map(item => createItemCard(item)).join('');
            } catch (err) {
                showToast('Failed to load items', 'error');
            }
        }
    </script>
</body>
</html>
