<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Report a found item on campus">
    <title>Report Found Item - CampusFind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div id="main-navbar"></div>

    <div class="page-header" style="padding-top: 6rem;">
        <div class="container">
            <h2><i class="bi bi-hand-thumbs-up me-2"></i>Report Found Item</h2>
            <p>Help someone find their belongings by reporting what you found</p>
        </div>
    </div>

    <div class="container form-page">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-card animate-slide-up">
                    <form id="report-form">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="item_name" class="form-label">Item Name *</label>
                                <input type="text" class="form-control" id="item_name" placeholder="e.g., Blue Denim Jacket" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="category_id" class="form-label">Category</label>
                                <select class="form-select" id="category_id">
                                    <option value="">Select Category</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description *</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Describe the item you found..." required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="location" class="form-label">Where Found *</label>
                                <input type="text" class="form-control" id="location" placeholder="e.g., Main Cafeteria, Table 5" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="date" class="form-label">Date Found *</label>
                                <input type="date" class="form-control" id="date" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="contact_info" class="form-label">Contact Information</label>
                            <input type="text" class="form-control" id="contact_info" placeholder="Email or phone number">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Upload Image</label>
                            <div class="upload-area" onclick="document.getElementById('image').click()">
                                <i class="bi bi-cloud-arrow-up d-block"></i>
                                <p>Click to upload an image of the item</p>
                                <small class="text-muted">Max 5MB • JPEG, PNG, GIF, WebP</small>
                                <img id="preview" class="upload-preview d-block mx-auto">
                            </div>
                            <input type="file" id="image" accept="image/*" hidden>
                        </div>
                        <button type="submit" class="btn btn-success-custom w-100" id="submit-btn" style="padding: 0.75rem;">
                            <i class="bi bi-send me-2"></i>Submit Report
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="main-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ok = await requireAuth('found');
            if (!ok) return;
            loadCategoryOptions('category_id');
            document.getElementById('date').value = new Date().toISOString().split('T')[0];
        });

        document.getElementById('image').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const preview = document.getElementById('preview');
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        });

        document.getElementById('report-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting...';

            try {
                const formData = new FormData();
                formData.append('item_name', document.getElementById('item_name').value);
                formData.append('category_id', document.getElementById('category_id').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('location', document.getElementById('location').value);
                formData.append('date', document.getElementById('date').value);
                formData.append('contact_info', document.getElementById('contact_info').value);
                formData.append('status', 'Found');

                const imageFile = document.getElementById('image').files[0];
                if (imageFile) {
                    formData.append('image', imageFile);
                }

                const data = await apiRequest('/items', { method: 'POST', body: formData });
                showToast('Found item reported successfully!', 'success');
                setTimeout(() => window.location.href = '/dashboard.html', 1000);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-send me-2"></i>Submit Report';
            }
        });
    </script>
</body>
</html>
